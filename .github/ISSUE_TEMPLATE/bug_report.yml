name: Bug report
description: The Cyclone Cache library does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities: do not file them here, see the [security policy](https://github.com/We-Amp/cyclone-cache/security/policy).
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from, or the mod_pagespeed version that embeds it.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: OS / distribution and architecture, compiler and its version, and the CMake preset or options you used.
      placeholder: Ubuntu 24.04 amd64, clang 20, cmake --preset release
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, the smaller the better. A failing test case is welcome.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, test output or a stack trace.
      render: text
