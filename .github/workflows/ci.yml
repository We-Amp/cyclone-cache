name: CI

# Minimal public CI: build + test on the three GitHub-hosted
# platforms, plus the license-header gate and the public-tree hygiene gate
# (tools/ci/check-public-hygiene.sh — keeps private-infrastructure and
# private-process vocabulary out of the public tree). The exhaustive lanes
# (sanitizers, TSan, lint, fuzzing, CVE scanning, nightly stress) stay on
# the private fleet and are deliberately not part of this workflow.
#
# The build mirrors the private lanes: bundled SHA-256 (no OpenSSL/vcpkg
# dependency) and Catch2 via FetchContent.  One extra Linux job builds the
# OpenSSL key-hash backend instead (see openssl-backend below).  Tests run
# as a single process (the binary directly, not `ctest -j`): the Catch2
# cases share a fixed on-disk temp path, so parallel test processes race on
# file sharing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macos-latest builds take 10-27 min depending on the runner, plus ~5 min
    # of tests, so 30 min cancelled otherwise-green runs mid-test.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Compiler cache: ccache on all three platforms, persisted with
      # actions/cache.  CMake reads the CMAKE_<LANG>_COMPILER_LAUNCHER and
      # CMAKE_GENERATOR environment variables set below, so the Configure
      # command itself is unchanged.  Windows builds with Ninja Multi-Config
      # (the Visual Studio generator ignores compiler launchers) and the same
      # MSVC toolset the VS generator would pick; the multi-config generator
      # keeps the build/Release/ output layout the Test step expects.
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache
      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ccache
      - name: Install ccache and set up MSVC + Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache --no-progress -y | Out-Null
          # The launcher must be the real ccache.exe, not the chocolatey shim.
          $ccache = Get-ChildItem -Recurse -Filter ccache.exe `
            "$env:ChocolateyInstall\lib\ccache" | Select-Object -First 1
          # Import the vcvars64 environment of the newest Visual Studio (the
          # one the VS generator selects).  New PATH entries are APPENDED so
          # the runner's own cmake keeps precedence over the VS-bundled one.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          $old = @{}
          Get-ChildItem env: | ForEach-Object { $old[$_.Name] = $_.Value }
          $oldPath = $env:PATH -split ';'
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            ForEach-Object {
              if ($_ -notmatch '^([^=]+)=(.*)$') { return }
              $name = $Matches[1]; $value = $Matches[2]
              if ($name -eq 'PATH' -or $name -eq 'Path') {
                $add = ($value -split ';') | Where-Object { $_ -and ($oldPath -notcontains $_) }
                $value = (@($env:PATH) + $add) -join ';'
                $name = 'PATH'
              } elseif ($old[$name] -eq $value) { return }
              "$name=$value" >> $env:GITHUB_ENV
            }
          @(
            'CMAKE_GENERATOR=Ninja Multi-Config'
            'CC=cl'
            'CXX=cl'
            "CCACHE_EXE=$($ccache.FullName -replace '\\', '/')"
          ) >> $env:GITHUB_ENV
      - name: Configure ccache
        id: ccache
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe=$CCACHE_EXE
            compiler=$(cl 2>&1 | head -n1 || true)
          else
            exe=$(command -v ccache)
            compiler=$(c++ --version | head -n1 || true)
            # Cross-image safety on Linux/macOS: hash the compiler's version
            # output, not the mtime of the /usr/bin/c++ shim.
            echo "CCACHE_COMPILERCHECK=%compiler% --version" >> "$GITHUB_ENV"
          fi
          echo "compiler: $compiler"
          echo "compiler-id=$(printf '%s' "$compiler" | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
          {
            echo "CMAKE_C_COMPILER_LAUNCHER=$exe"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=$exe"
            echo "CMAKE_OBJCXX_COMPILER_LAUNCHER=$exe"
            echo "CCACHE_DIR=${{ runner.temp }}/ccache"
            # Rewrite absolute paths under the workspace (sources, build/,
            # the FetchContent Catch2 tree) to relative ones, and keep the
            # cwd out of the hash, so hits do not depend on the checkout path.
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=1"
            # A fresh checkout stamps every file "now"; without this, ccache
            # distrusts headers whose mtime/ctime is too recent.
            echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime"
            echo "CCACHE_COMPRESS=1"
            echo "CCACHE_COMPRESSLEVEL=3"
            # A full build is ~220 objects, 8-18 MB compressed depending on
            # the OS; 100 MB keeps several generations per OS while each
            # saved entry stays small against the repo's 10 GB cache quota.
            echo "CCACHE_MAXSIZE=100M"
          } >> "$GITHUB_ENV"
      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.ccache.outputs.compiler-id }}-Release-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.ccache.outputs.compiler-id }}-Release-${{ hashFiles('CMakeLists.txt') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.ccache.outputs.compiler-id }}-Release-
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCYCLONE_USE_BUNDLED_SHA256=ON
      - name: Build
        shell: bash
        run: |
          "$CMAKE_CXX_COMPILER_LAUNCHER" --zero-stats > /dev/null
          rc=0
          cmake --build build --config Release -j || rc=$?
          "$CMAKE_CXX_COMPILER_LAUNCHER" --show-stats --verbose
          exit "$rc"
      # Saved right after the build (not in a post step) so a failing Test
      # step still persists the objects.  The key carries the commit, so an
      # exact hit (a rerun) has nothing new to save.
      - name: Save compiler cache
        if: >-
          !cancelled() && steps.ccache-restore.outcome == 'success' &&
          steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      # Self-diagnosis (issue #38): the Test step prints the binary's exit
      # code, turns each Catch2 failure into a job annotation (so the failing
      # assertion shows on the run summary, not only deep in the log), and on
      # Windows arms WER local dumps so a crash at exit leaves a minidump and
      # an event-log record behind.  When reading a rerun's log from the CLI,
      # pass the attempt: `gh run view --job <id> --log` shows the LATEST
      # attempt's log whatever job id is given; the per-attempt log is
      # `gh api repos/<owner>/<repo>/actions/jobs/<id>/logs`.
      - name: Arm crash dumps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:GITHUB_WORKSPACE 'crashdumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          foreach ($exe in 'cyclone-tests.exe', 'cyclone-test-peer.exe') {
            $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          }
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin=./build/Release/cyclone-tests.exe
          else
            bin=./build/cyclone-tests
          fi
          set +e
          "$bin" 2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "cyclone-tests exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            # One annotation per failed assertion: its location and the
            # assertion that follows the FAILED: line (CRs stripped: Windows
            # text-mode output).
            tr -d '\r' < test-output.txt > test-output.lf
            grep -A1 -E ': FAILED:$' test-output.lf | grep -v '^--$' |
              paste - - | head -n 20 |
              while IFS= read -r line; do
                printf '::error title=cyclone-tests failure::%s\n' "$line"
              done || true
            if ! grep -q ': FAILED:$' test-output.lf; then
              echo "::error title=cyclone-tests exit code $rc::no Catch2 assertion failed; the process failed outside the test cases (crash, exit-time teardown, or a reporter error)"
            fi
          fi
          exit "$rc"
      - name: Crash evidence (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem -ErrorAction SilentlyContinue (Join-Path $env:GITHUB_WORKSPACE 'crashdumps')
          Get-WinEvent -ErrorAction SilentlyContinue -MaxEvents 5 -FilterHashtable @{
            LogName = 'Application'; ProviderName = 'Application Error', 'Windows Error Reporting'
            StartTime = (Get-Date).AddHours(-1) } | Format-List TimeCreated, ProviderName, Message
      - name: Upload crash dumps (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crashdumps-attempt-${{ github.run_attempt }}
          path: crashdumps/
          if-no-files-found: ignore
          retention-days: 1

  # The jobs above hash keys with the bundled SHA-256, the default.  This
  # one builds the other backend, which an application opts into with
  # -DCYCLONE_USE_BUNDLED_SHA256=OFF: OpenSSL's libcrypto.  The option is
  # passed explicitly here so the job keeps building that backend whatever
  # the default is.  It differs in more than speed: the crypto library brings
  # process-wide state and an exit handler of its own, and a fault in how the
  # key hash meets them (see the note in src/core/key.cpp) never shows in a
  # bundled build.  The whole suite runs, since every cache operation starts
  # with a key hash.
  openssl-backend:
    name: Build & Test (ubuntu-latest, OpenSSL key hash)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install OpenSSL headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libssl-dev
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCYCLONE_USE_BUNDLED_SHA256=OFF
          -DCYCLONE_BUILD_BENCHMARKS=OFF -DCYCLONE_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --target cyclone-tests cyclone-test-peer -j
      - name: The key hash is OpenSSL's
        run: |
          grep -q '^OPENSSL_CRYPTO_LIBRARY:' build/CMakeCache.txt
          ldd build/cyclone-test-peer | grep -q libcrypto
      - name: Test
        run: |
          set +e
          ./build/cyclone-tests 2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "cyclone-tests exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            grep -A1 -E ': FAILED:$' test-output.txt | grep -v '^--$' |
              paste - - | head -n 20 |
              while IFS= read -r line; do
                printf '::error title=cyclone-tests failure::%s\n' "$line"
              done || true
          fi
          exit "$rc"

  license-audit:
    name: License audit (Apache RAT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Apache RAT (fails on any unknown license)
        env:
          RAT_WORK_DIR: ${{ runner.temp }}/rat
        run: bash tools/ci/rat.sh
      - name: Upload RAT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rat-report
          path: ${{ runner.temp }}/rat/rat-report.txt
          if-no-files-found: warn

  public-hygiene:
    name: Public-tree hygiene gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan the tracked tree for non-public vocabulary
        run: bash tools/ci/check-public-hygiene.sh
